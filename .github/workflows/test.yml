name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package tests and example builds
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SPM_DIR: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # Prefer "iPhone 17" (the name used in CLAUDE.md); fall back to any available iPhone.
      - name: Pick simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone")) | .name] as $all | (if ($all | index("iPhone 17")) then "iPhone 17" else ($all[0] // empty) end)')
          if [ -z "$SIM" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "Using simulator: $SIM"
          echo "DESTINATION=platform=iOS Simulator,name=$SIM,OS=latest" >> "$GITHUB_ENV"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Includes the CSS snapshot test and the WKWebView-backed injector tests.
      - name: Test FolioReaderKit
        run: |
          xcodebuild test \
            -scheme FolioReaderKit \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -resultBundlePath TestResults.xcresult

      - name: Build Example
        run: |
          xcodebuild build \
            -project Example/Example.xcodeproj \
            -scheme Example \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            CODE_SIGNING_ALLOWED=NO

      # iPad-only (two readers side by side), so it can't use the iPhone destination. It is the
      # only sample that creates FolioReaderContainer from a storyboard.
      - name: Build MultipleInstance-Example
        run: |
          xcodebuild build \
            -project Example/Example.xcodeproj \
            -scheme MultipleInstance-Example \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
