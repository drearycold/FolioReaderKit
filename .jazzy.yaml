module: FolioReaderKit
author: Heberti Almeida
author_url: https://twitter.com/hebertialmeida
github_url: https://github.com/drearycold/FolioReaderKit
root_url: https://folioReader.github.io/FolioReaderKit/
clean: true
output: docs/
theme: fullwidth
undocumented_text: ""
hide_documentation_coverage: true

min_acl: public
# exclude: ["Source/Core/Helpers/*", "Source/Core/Keychain.swift"]

# Swift package with UIKit dependencies: build the SPM scheme for the iOS Simulator.
xcodebuild_arguments:
    - "-scheme"
    - "FolioReaderKit"
    - "-destination"
    - "generic/platform=iOS Simulator"